# The price feed: every 15 minutes, look at every WoW Forever auction house in Blizzard's Game Data API; when
# Blizzard has refreshed one (about hourly), build Data/Feed.lua (tools/feed/build.mjs) and publish the addon with
# it as a new release, which addon managers (WowUp) pick up. Checking often means a late or skipped GitHub run
# costs minutes, not hours; a check with nothing new publishes nothing. Needs the repository secrets
# BLIZZARD_CLIENT_ID and BLIZZARD_CLIENT_SECRET (https://develop.battle.net/access/clients). Optional repository variables FEED_REGIONS (default: us) and
# FEED_HOUSES (default: 110 - PvP Alliance; Blackwater, the neutral house, isn't followed since v0.28).
name: Price feed

on:
  schedule:
    # every 15 minutes, off the busy minutes (GitHub delays and drops scheduled runs at :00 the most)
    - cron: "4,19,34,49 * * * *"
  # by hand from the Actions page (publishes whatever the prices are), or from an outside timer that sends
  # inputs.only_new = "true" (publishes only when Blizzard has refreshed, like the schedule)
  workflow_dispatch:
    inputs:
      only_new:
        description: "Publish only when Blizzard has new prices"
        required: false
        default: "false"
      curseforge:
        description: "Also upload this build to CurseForge"
        required: false
        default: "false"
  # a merged change goes out at once (with the prices as they are, new or not)
  push:
    branches: [main]
    paths-ignore:
      - "**.md"

concurrency:
  group: price-feed
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Restore the last download and the history
        uses: actions/cache/restore@v5
        with:
          path: tools/feed/cache
          key: feed-cache-${{ github.run_id }}
          restore-keys: feed-cache-

      - name: Check the Blizzard key
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
        run: |
          missing=0
          for name in BLIZZARD_CLIENT_ID BLIZZARD_CLIENT_SECRET; do
            if [ -z "${!name}" ]; then
              echo "::error::The repository secret $name is missing or empty. Add it under Settings > Secrets and variables > Actions > Secrets tab > New repository secret (not Variables, not an Environment, not Codespaces or Dependabot), named exactly $name."
              missing=1
            else
              echo "$name is set (value hidden)"
            fi
          done
          exit $missing

      - name: Bring back the history if the cache lost it
        env:
          FEED_REGIONS: ${{ vars.FEED_REGIONS || 'us' }}
        run: |
          mkdir -p tools/feed/cache
          for region in ${FEED_REGIONS//,/ }; do
            file="tools/feed/cache/history-$region.json"
            if [ ! -f "$file" ] && git fetch -q --depth=1 origin feed-history 2>/dev/null; then
              if git show "origin/feed-history:history-$region.json.gz" 2>/dev/null | gunzip > "$file.tmp" && [ -s "$file.tmp" ]; then
                mv "$file.tmp" "$file" && echo "history for $region restored from the feed-history branch"
              fi
            fi
          done

      - name: Build the price feed
        id: feed
        env:
          # the frequent checks publish only new prices; a merge or a manual run always builds
          FEED_ONLY_NEW: ${{ (github.event_name == 'schedule' || inputs.only_new == 'true') && '1' || '' }}
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
          FEED_REGIONS: ${{ vars.FEED_REGIONS || 'us' }}
          # PvP Alliance (110); all twelve: set the repository variable FEED_HOUSES to their ids
          FEED_HOUSES: ${{ vars.FEED_HOUSES || '110' }}
          FEED_KEEP_DAYS: "90"
          FEED_SHIP_DAYS: "30"
        run: node tools/feed/build.mjs

      - name: Save the download and the history
        if: steps.feed.outputs.changed != 'false'
        uses: actions/cache/save@v5
        with:
          path: tools/feed/cache
          key: feed-cache-${{ github.run_id }}

      - name: Keep the history in the feed-history branch
        if: steps.feed.outputs.changed != 'false'
        # GitHub's cache is dropped after a week unused or when full; the branch keeps the record for good.
        # One commit, replaced every run, so the repository doesn't grow.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/history && mkdir -p /tmp/history
          for f in tools/feed/cache/history-*.json; do gzip -c "$f" > "/tmp/history/$(basename "$f").gz"; done
          cd /tmp/history
          git init -q -b feed-history
          git add .
          git -c user.name="price-feed" -c user.email="price-feed@users.noreply.github.com" commit -q -m "Feed history as of $(date -u '+%Y-%m-%d %H:%M') UTC"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" feed-history

      - name: Package the addon with the feed
        if: steps.feed.outputs.changed != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BASE=$(grep -m1 '^## Version:' WolfOfBootyBay.toc | sed 's/^## Version: *//; s/\r//')
          MAJMIN=$(echo "$BASE" | cut -d. -f1,2)
          VERSION="$MAJMIN.$(date -u +%Y%m%d%H%M)"
          # a new version (the release before was of another MAJ.MIN): CurseForge gets it (the hourly price builds
          # of one version don't go there: its rules don't allow a stream of data-only files)
          PREV=$(gh release list --limit 30 --json tagName --jq '[.[] | select(.tagName | startswith("v"))][0].tagName // ""' 2>/dev/null || echo "")
          PREVMAJMIN=$(echo "${PREV#v}" | cut -d. -f1,2)
          # (a commit that says [no curseforge] - a test build for the companion's updates - stays off CurseForge)
          if [ "$PREVMAJMIN" != "$MAJMIN" ] && ! git log -1 --format=%B | grep -qi "\[no curseforge\]"; then echo "NEW_VERSION=1" >> "$GITHUB_ENV"; fi
          echo "MAJMIN=$MAJMIN" >> "$GITHUB_ENV"
          # the newest Wolf and prices companion, for the addon's "a newer one is out" line (v0.42): the companion
          # brings this file every hour, so even a friend with nobody online hears of a new version
          printf '\nif FT.FEED then FT.FEED.release = "%s"; FT.FEED.companion = "%s" end\n' "$MAJMIN" "$(tr -d '\r\n ' < companion/VERSION)" >> Data/Feed.lua
          mkdir -p dist/WolfOfBootyBay
          git archive HEAD | tar -x -C dist/WolfOfBootyBay
          cp Data/Feed.lua dist/WolfOfBootyBay/Data/Feed.lua
          # (v0.58) the commit it's built from, for the companion's updates (a new commit: a new Wolf, hotfixes too),
          # and the version in the code as well: a /reload reads new code but not the TOC (the game reads that at
          # launch), so after an update by the companion the code knows its own version
          COMMIT=$(git rev-parse --short=12 HEAD)
          ( cd dist/WolfOfBootyBay \
            && rm -rf .github tools companion .gitattributes .gitignore .pkgmeta \
            && sed -i "s/^## Version: .*/## Version: $VERSION\n## X-Commit: $COMMIT/" WolfOfBootyBay.toc \
            && sed -i "s/^local RELEASE = \"v[0-9.]*\"/local RELEASE = \"v$VERSION\"/" Core.lua \
            && grep -q "^## X-Commit: $COMMIT" WolfOfBootyBay.toc && grep -q "^local RELEASE = \"v$VERSION\"" Core.lua )
          ( cd dist && zip -qr "WolfOfBootyBay-$VERSION.zip" WolfOfBootyBay )
          ADDON_SHA=$(sha256sum "dist/WolfOfBootyBay-$VERSION.zip" | cut -d' ' -f1)
          # for the companion app (companion/, released on its own by companion.yml): the price file on its own and
          # a small note of when its prices are from (it reads only this every 15 minutes), at releases/latest/download/
          cp Data/Feed.lua dist/Feed.lua
          node -e '
            const fs = require("fs");
            const lua = fs.readFileSync("Data/Feed.lua", "utf8");
            const built = Number((lua.match(/built = (\d+)/) || [])[1] || 0);
            const ts = [...lua.matchAll(/\[(\d+)\] = \{ t = (\d+),/g)].map(m => [m[1], Number(m[2])]);
            const houses = Object.fromEntries(ts);
            const t = Math.max(0, ...ts.map(x => x[1]));
            // (v0.58) the addon itself, for the companion: which commit, the zip (this release, by its tag) and its fingerprint
            const [version, commit, sha, repo] = process.argv.slice(1);
            const zip = `https://github.com/${repo}/releases/download/v${version}/WolfOfBootyBay-${version}.zip`;
            fs.writeFileSync("dist/latest.json", JSON.stringify({ built, t, houses, version, bytes: lua.length,
              addonVersion: version, addonCommit: commit, addonZip: zip, addonSha256: sha }));
          ' "$VERSION" "$COMMIT" "$ADDON_SHA" "$GITHUB_REPOSITORY"
          # for WowUp (it reads GitHub releases): which zip is the addon, for every game type it may call WoW Forever
          # by. Without it WowUp guesses from the newest release only, and the companion's own release (no zip) can
          # be the newest.
          node -e '
            const [file, version, iface] = process.argv.slice(1);
            const flavors = ["mainline", "classic", "bcc", "wrath", "cata", "mists"];
            const release = { name: "Wolf", version, filename: file, nolib: false,
              metadata: flavors.map(flavor => ({ flavor, interface: Number(iface) })) };
            require("fs").writeFileSync("dist/release.json", JSON.stringify({ releases: [release] }));
          ' "WolfOfBootyBay-$VERSION.zip" "$VERSION" "$(grep -m1 '^## Interface:' WolfOfBootyBay.toc | sed 's/^## Interface: *//; s/\r//')"
          cat dist/release.json; echo
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Publish the release
        if: steps.feed.outputs.changed != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" "dist/WolfOfBootyBay-$VERSION.zip" dist/Feed.lua dist/latest.json dist/release.json \
            --title "v$VERSION" \
            --notes "Wolf with prices as of $(date -u '+%Y-%m-%d %H:%M') UTC." \
            --latest
          # keep the newest 12 releases, by when they were published: createdAt is the commit's date, the same for
          # every hourly build of one commit, so sorting on it threw away new releases at random (often the one
          # just made). The release just made is never deleted.
          # (only the v... price builds: the companion's own releases stay)
          gh release list --limit 100 --json tagName,publishedAt \
            --jq '[.[] | select(.tagName | startswith("v"))] | sort_by(.publishedAt) | reverse | .[12:] | .[].tagName' |
          while read -r tag; do
            [ "$tag" = "v$VERSION" ] && continue
            gh release delete "$tag" --yes --cleanup-tag
          done

      # CurseForge (project 1831462): each new version once, with that hour's prices inside - never the hourly price
      # builds. Needs the repository secret CF_API_TOKEN (an author upload token: CurseForge > account > API tokens;
      # not the Core API key). The game version: the repository variable CF_GAME_VERSIONS (ids, comma-separated), else
      # the newest version of CurseForge's WoW Forever version type. A failure here never stops the GitHub release.
      - name: Upload to CurseForge
        if: steps.feed.outputs.changed != 'false' && ((github.event_name == 'push' && env.NEW_VERSION == '1') || inputs.curseforge == 'true')
        continue-on-error: true
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_PROJECT_ID: ${{ vars.CF_PROJECT_ID || '1831462' }}
          CF_GAME_VERSIONS: ${{ vars.CF_GAME_VERSIONS || '' }}
        run: |
          if [ -z "$CF_API_TOKEN" ]; then echo "::notice::No CF_API_TOKEN secret yet: CurseForge skipped"; exit 0; fi
          API=https://wow.curseforge.com/api
          if [ -z "$CF_GAME_VERSIONS" ]; then
            curl -sSf -H "X-Api-Token: $CF_API_TOKEN" "$API/game/version-types" > /tmp/cf-types.json
            curl -sSf -H "X-Api-Token: $CF_API_TOKEN" "$API/game/versions" > /tmp/cf-versions.json
            CF_GAME_VERSIONS=$(node -e '
              const types = JSON.parse(require("fs").readFileSync("/tmp/cf-types.json", "utf8"));
              const versions = JSON.parse(require("fs").readFileSync("/tmp/cf-versions.json", "utf8"));
              const forever = types.filter(t => /forever/i.test(t.name || "") || /forever/i.test(t.slug || "")).map(t => t.id);
              console.error("CurseForge version types:", types.map(t => t.id + "=" + t.name).join(", "));
              const pick = versions.filter(v => forever.includes(v.gameVersionTypeID)).sort((a, b) => b.id - a.id)[0];
              if (pick) { console.error("picked", pick.id, pick.name); console.log(String(pick.id)); }
            ')
          fi
          if [ -z "$CF_GAME_VERSIONS" ]; then
            echo "::warning::No WoW Forever game version found on CurseForge: set the repository variable CF_GAME_VERSIONS"
            exit 1
          fi
          # this version's part of the changelog
          awk -v v="## v$MAJMIN " 'index($0, v) == 1 { on = 1; next } on && /^## v/ { exit } on { print }' CHANGELOG.md > /tmp/cf-changelog.md
          [ -s /tmp/cf-changelog.md ] || echo "Wolf $VERSION" > /tmp/cf-changelog.md
          node -e '
            const fs = require("fs");
            const meta = {
              changelog: fs.readFileSync("/tmp/cf-changelog.md", "utf8"),
              changelogType: "markdown",
              displayName: "Wolf v" + process.argv[1],
              releaseType: "release",
              gameVersions: process.argv[2].split(",").map(Number).filter(Boolean),
            };
            fs.writeFileSync("/tmp/cf-meta.json", JSON.stringify(meta));
          ' "$VERSION" "$CF_GAME_VERSIONS"
          code=$(curl -sS -o /tmp/cf-response.txt -w "%{http_code}" -H "X-Api-Token: $CF_API_TOKEN" \
            -F "metadata=</tmp/cf-meta.json" -F "file=@dist/WolfOfBootyBay-$VERSION.zip" \
            "$API/projects/$CF_PROJECT_ID/upload-file")
          cat /tmp/cf-response.txt; echo
          if [ "$code" != "200" ]; then echo "::warning::CurseForge upload failed (HTTP $code)"; exit 1; fi
          echo "::notice::Uploaded v$VERSION to CurseForge (it shows once their review passes it)"
