# Packages the addon when a version tag is pushed (git tag v1.1.0 && git push origin v1.1.0):
# a zip on the GitHub release, and an upload to CurseForge once the project ID is in the TOC
# (## X-Curse-Project-ID) and the CF_API_KEY secret is set in the repository settings.
name: Package and release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Package and upload
        uses: BigWigsMods/packager@v2
