# Where every item comes from: Data/Sources.lua from ForeverDB, Wolf's recipes and Wolf's own notes (daily, or by hand).
name: sources
on:
  schedule:
    - cron: "23 8 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [tools/sources/**, .github/workflows/sources.yml]
permissions:
  contents: write
jobs:
  sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - name: ForeverDB and lupa
        run: |
          git clone -q --depth 1 https://github.com/foreverfraddons/forever-db.git /tmp/forever-db
          pip install -q lupa
      - name: The newest prices (which items trade, for the gap list)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          mkdir -p /tmp/rel && cd /tmp/rel
          gh release download --repo "$GITHUB_REPOSITORY" --pattern "*.zip" || true
          unzip -q -o ./*.zip 2>/dev/null || true
          find /tmp/rel -name Feed.lua | head -1 > /tmp/feedpath
      - name: Build Data/Sources.lua and Data/Dungeons.lua
        run: python3 tools/sources/build.py /tmp/forever-db "$(cat /tmp/feedpath)"
      - name: Commit it when it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Data/Sources.lua Data/Dungeons.lua tools/sources/gaps.txt
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "Item sources from ForeverDB"
          git pull --rebase -q && git push
