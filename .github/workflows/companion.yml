# The Wolf prices companion (companion/): built on Windows, tested against a pretend World of Warcraft folder
# (it must download the real price file and write its note), and pictures of its windows made for a look.
# On main it's published to its own release, tag "companion" (never "latest": that's the hourly price builds):
#   WolfPricesSetup.exe  the download for people (setup installs it)
#   WolfPrices.exe       the same program, for its quiet self-update
#   companion.json       { version, sha256 }: what the installed ones compare against
# Other branches put the pictures in the "companion-preview" pre-release instead (nothing published).
name: companion

on:
  push:
    paths:
      - "companion/**"
      - ".github/workflows/companion.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: companion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: pwsh
        run: dotnet build companion/WolfPrices.csproj -c Release -o out --nologo

      - name: Test against a pretend World of Warcraft folder
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'wow'
          $addon = Join-Path $root '_forever_\Interface\AddOns\WolfOfBootyBay'
          New-Item -ItemType Directory -Force -Path (Join-Path $addon 'Data') | Out-Null
          Copy-Item WolfOfBootyBay.toc $addon
          Copy-Item Data\Companion.lua (Join-Path $addon 'Data')
          $p = Start-Process -FilePath out\WolfPrices.exe -ArgumentList @('--check', "`"$root`"") -Wait -PassThru
          Get-Content (Join-Path $root 'wolfprices-check.txt')
          if ($p.ExitCode -ne 0) { throw "check exited $($p.ExitCode)" }
          $feed = Join-Path $addon 'Data\Feed.lua'
          if (-not (Get-Content $feed -TotalCount 1).StartsWith('-- Generated by tools/feed/build.mjs')) { throw 'no price file' }
          "price file: $((Get-Item $feed).Length) bytes"
          $note = Get-Content (Join-Path $addon 'Data\Companion.lua') -Raw
          $note
          if ($note -notmatch 'FT\.COMPANION = \{ version = "[\d.]+", checked = \d+, built = \d+, t = \d+(, [^}]*)? \}') { throw 'no note' }
          # (1.1) Wolf itself: the pretend folder had only its TOC, with no commit in it - the newest Wolf is put in
          if (-not (Test-Path (Join-Path $addon 'Core.lua'))) { throw 'Wolf was not updated' }
          $toc = Get-Content (Join-Path $addon 'WolfOfBootyBay.toc') -Raw
          if ($toc -notmatch '## X-Commit: \w+') { throw 'no commit in the new TOC' }
          if ($note -notmatch 'updated = "[\d.]+"') { throw 'the note does not say Wolf was updated' }
          "Wolf put in: $(($toc | Select-String '## Version: (.*)').Matches[0].Groups[1].Value)"
          # a second check: nothing newer, no download
          $p = Start-Process -FilePath out\WolfPrices.exe -ArgumentList @('--check', "`"$root`"") -Wait -PassThru
          $second = Get-Content (Join-Path $root 'wolfprices-check.txt') -Raw
          $second
          if ($second -notmatch 'wolfUpdated= ') { throw 'the same Wolf was put in twice' }
          # a developer's copy (made with git) is never touched
          $dev = Join-Path $env:RUNNER_TEMP 'wowdev'
          $devAddon = Join-Path $dev '_forever_\Interface\AddOns\WolfOfBootyBay'
          New-Item -ItemType Directory -Force -Path (Join-Path $devAddon 'Data'), (Join-Path $devAddon '.git') | Out-Null
          Copy-Item WolfOfBootyBay.toc $devAddon
          Copy-Item Data\Companion.lua (Join-Path $devAddon 'Data')
          $p = Start-Process -FilePath out\WolfPrices.exe -ArgumentList @('--check', "`"$dev`"") -Wait -PassThru
          if (Test-Path (Join-Path $devAddon 'Core.lua')) { throw "a developer's copy was updated" }
          echo "WOWROOT=$root" >> $env:GITHUB_ENV

      - name: Pictures of its windows
        shell: pwsh
        run: |
          $pics = Join-Path $env:RUNNER_TEMP 'pics'
          $p = Start-Process -FilePath out\WolfPrices.exe -ArgumentList @('--pictures', "`"$pics`"", '--wow', "`"$env:WOWROOT`"") -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "pictures exited $($p.ExitCode)" }
          Get-ChildItem $pics | Format-Table Name, Length
          echo "PICS=$pics" >> $env:GITHUB_ENV

      - name: Publish (main) or preview (other branches)
        shell: pwsh
        run: |
          $version = (Get-Content companion\VERSION -Raw).Trim()
          $sha = (Get-FileHash out\WolfPrices.exe -Algorithm SHA256).Hash.ToLower()
          "version $version  sha256 $sha"
          Copy-Item out\WolfPrices.exe out\WolfPricesSetup.exe
          $pics = Get-ChildItem $env:PICS -Filter *.png | ForEach-Object { $_.FullName }
          if ("${{ github.ref }}" -eq 'refs/heads/main') {
            gh release view companion *> $null
            if ($LASTEXITCODE -ne 0) {
              gh release create companion --title "Wolf prices companion" --latest=false `
                --notes "The Wolf prices companion for Windows: download WolfPricesSetup.exe and run it. It keeps your addon's prices fresh, quietly."
            }
            gh release upload companion out\WolfPricesSetup.exe out\WolfPrices.exe --clobber
            @{ version = $version; sha256 = $sha } | ConvertTo-Json -Compress | Set-Content -Path out\companion.json -Encoding ascii -NoNewline
            gh release upload companion out\companion.json @pics --clobber
          } else {
            gh release view companion-preview *> $null
            if ($LASTEXITCODE -ne 0) {
              gh release create companion-preview --title "Wolf prices companion (preview)" --prerelease --latest=false --notes "Pictures and builds from branches. Not for installing."
            }
            gh release upload companion-preview @pics out\WolfPricesSetup.exe --clobber
          }
